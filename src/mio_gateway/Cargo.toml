[package]
name = "mio_gateway"
version = "0.0.0"
edition = "2021"

# The library is the wire contract and the session logic. It needs no ROS, so `cargo test` runs it
# anywhere — which is what CI does, against the vectors in miobots-protocol. The binary is the ROS
# node and is behind `ros`; `./build.sh` turns that on.
[features]
ros = ["dep:rclrs", "dep:ros-env", "dep:futures", "dep:tokio", "dep:tokio-tungstenite"]

[[bin]]
name = "mio_gateway"
required-features = ["ros"]

[dependencies]
serde_json = "=1.0.132"
ulid = "1"
rclrs = { version = "=0.8.0", optional = true }
ros-env = { version = "=0.3.0", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", optional = true }
